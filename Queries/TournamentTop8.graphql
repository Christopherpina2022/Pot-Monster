query TournamentTop8($tournamentSlug: String!) {
  tournament(slug: $tournamentSlug) {
    events {
      videogame {
        name
      }
      standings(query: {perPage: 8}) {
        nodes {
          entrant {
            participants {
              player {
                  gamerTag
                  prefix
              }
            }
          }
          placement
        }
      }
    }
  }
}