query TournamentHeadCount($tournamentSlug: String!) {
  tournament(slug: $tournamentSlug) {
    events {
      videogame {
        name
      }
      entrants {
        nodes {
          participants {
            gamerTag
            prefix
            user {
              genderPronoun
              birthday
            }
          }
        }
      }
    }
  }
}